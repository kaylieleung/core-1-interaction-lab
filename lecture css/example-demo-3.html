<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Position property</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			height: 100vh;
			width: 100vh;
		}

		.large {
			background-color: rgb(252, 136, 165);
			width: 450px;
			height: 575px;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			border-bottom: 75px solid green;
		}

		.medium {
			width: 250px;
			height: 400px;
			background-color: rgb(163, 107, 182);
			position: absolute;
			top: 50px;
			right: 50px;
		}

		.small {
			width: 150px;
			height: 300px;
			background-color: rgb(0, 155, 0);
			padding: 10px;
			position: absolute;
			top: 50px;
			left: 50px;
		}
		.window {
			width: 60px;
			height: 280px;
			background-color: greenyellow;
			display: inline-block;
		}
		.window:nth-of-type(1) {
			margin-right: 6px;
		}
		.connector {
			width: 50px;
			height: 325px;
			background-color: brown;
			position: absolute;
			top: 175px;
			left: 50px;
		}
		.connector__corner {
			width: 100px;
			height: 50px;
			background-color: brown;
		}
	</style>
</head>

<body>
	<a href="stretch-challenge.html">
    <button>stretch challenge!</button>
    </a>
	<div class="large">
		<div class="medium">
			<div class="small">
				<div class="window"></div>
				<div class="window"></div>
			</div>
		</div>
		<div class="connector">
			<div class="connector__corner"></div>
		</div>
	</div>
</body>

</html>
